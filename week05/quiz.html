<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic HTML and CSS Quiz | WDD 130</title>
  <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>

  <main>
    <h1>Basic HTML and CSS Quiz</h1>

    <form action="#" method="post" id="quiz-form">

      <div class="form-group">
        <label for="q1"><span class="q-num">1.</span> What does the acronym CSS stand for?</label>
        <input type="text" name="q1" id="q1" required>
      </div>

      <div class="form-group">
        <label for="q2"><span class="q-num">2.</span> How are id and class attributes selected in CSS?</label>
        <textarea name="q2" id="q2" rows="4" required></textarea>
      </div>

      <div class="form-group">
        <label for="q3"><span class="q-num">3.</span> Which of the following is a valid CSS comment?</label>
        <select name="q3" id="q3" required>
          <option value="" selected disabled>Choose One ...</option>
          <option value="slash-star">/* comment */</option>
          <option value="double-slash">// comment</option>
          <option value="html-comment">&lt;!-- comment --&gt;</option>
          <option value="hash">#comment</option>
        </select>
      </div>

      <div class="form-group">
        <label for="q4"><span class="q-num">4.</span> What is the bottom margin given this declaration?</label>
        <pre class="code-snippet"><code>margin: 10px 5px 15px;</code></pre>
        <input type="number" name="q4" id="q4" required>
      </div>

      <div class="form-group form-submit">
        <button type="submit">Submit Quiz</button>
      </div>

    </form>
  </main>

</body>
</html>
